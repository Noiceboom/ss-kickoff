<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex, nofollow">
<title>Service Scalers — Kickoff Doc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/kickoff.css">
</head>
<body>

<header>
  <div class="hbar">
    <img src="assets/logo-horizontal-charcoal.png" alt="Service Scalers">
    <div class="divider"></div>
    <div class="client">
      <span id="clientName">Loading…</span>
      <span class="sub" id="clientSub">&nbsp;</span>
    </div>
    <div class="saved" id="saved">Saved</div>
    <div class="prog">
      <div class="progtrack"><div class="progfill" id="pfill" style="width:0%"></div></div>
      <div class="progpct" id="ppct">0%</div>
    </div>
  </div>
  <div class="steps" id="pills"></div>
</header>

<main class="wrap">
  <div id="boot" class="card" style="margin-top:44px">Loading kickoff…</div>
  <div class="section" id="mount"></div>
</main>

<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
